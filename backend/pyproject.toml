[project]
name = "clipfusion-backend"
version = "0.1.0"
description = "ClipFusion AI — AI video clipping, smart framing, subtitles and social publishing backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Security
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    # Background jobs
    "celery[redis]>=5.4",
    "redis>=5.0",
    # Storage
    "boto3>=1.34",
    # Media / AI
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6.4",
    "faster-whisper>=1.0.3",
    "Pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "anthropic>=0.60",
    "yt-dlp>=2025.11",       # optional YouTube-link downloads (off by default, see Settings)
    "yt-dlp-ejs>=0.8",       # YouTube player challenge scripts used by yt-dlp (needs Node.js or Deno)
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10.14"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that run real models or long media processing",
    "network: tests that need internet access (model downloads)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
